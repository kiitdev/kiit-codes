name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kiit-codes-kotlin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: ktlint
        run: ./gradlew :kiit-codes:ktlintCheck

      - name: detekt
        run: ./gradlew :kiit-codes:detekt

      - name: JVM tests (commonTest)
        run: ./gradlew :kiit-codes:jvmTest

  ts-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ports/kiit-codes-ts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
