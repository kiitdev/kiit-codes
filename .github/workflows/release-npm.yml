name: Release npm (@kiitdev/codes)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ports/kiit-codes-ts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, needed for --generate-notes to diff from the last tag

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Read version from package.json
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify tag does not already exist
        run: |
          if git rev-parse "npm-v${{ steps.version.outputs.value }}" >/dev/null 2>&1; then
            echo "Tag npm-v${{ steps.version.outputs.value }} already exists — bump the version in package.json first." >&2
            exit 1
          fi

      - name: Verification checks (typecheck + tests)
        run: |
          npm run typecheck
          npm test

      - name: Publish to npm
        # --access public is required the first time a new scoped (@kiit/...) package is
        # published — scoped packages default to private on npm otherwise. `npm publish` runs
        # `prepublishOnly` (typecheck + test + build) automatically before publishing.
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.KIIT_NPM_TOKEN }}

      - name: Tag release
        run: |
          git tag "npm-v${{ steps.version.outputs.value }}"
          git push origin "npm-v${{ steps.version.outputs.value }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "npm-v${{ steps.version.outputs.value }}" \
            --title "@kiitdev/codes v${{ steps.version.outputs.value }}" \
            --generate-notes
